<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillBridge AI - Create opportunity</title><link rel="stylesheet" href="style.css">
  <style>.create-card{max-width:760px;margin:40px auto;background:#fff;padding:30px;border-radius:18px;box-shadow:0 5px 20px rgba(0,0,0,.06)}.create-card label{display:block;font-weight:700;margin:18px 0 7px}.create-card input,.create-card select,.create-card textarea{width:100%;padding:12px;border:1px solid #dbe2ea;border-radius:10px;font:inherit}.create-card textarea{min-height:110px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.notice{padding:12px;border-radius:10px;background:#eef2ff;color:#3730a3;margin:12px 0}@media(max-width:650px){.row{grid-template-columns:1fr}.create-card{margin:20px}}</style>
</head>
<body><header class="navbar"><div class="logo">🎓 SkillBridge AI</div><div class="module">Industry workspace</div></header>
<main class="create-card"><span class="badge">💼 Opportunity publishing</span><h1>Create a real opportunity</h1><p class="section-description">Student matches are calculated from each role's stated requirements, with a clear explanation shown before application.</p><div id="message" class="notice">Sign in as an industry partner to publish.</div>
<form id="opportunityForm"><label for="company">Company</label><input id="company" required placeholder="Your organisation"><label for="title">Role title</label><input id="title" required placeholder="e.g. Frontend Development Intern"><div class="row"><div><label for="type">Type</label><select id="type"><option value="internship">Internship</option><option value="job">Job</option><option value="project">Industry project</option></select></div><div><label for="mode">Work mode</label><select id="mode"><option value="hybrid">Hybrid</option><option value="remote">Remote</option><option value="onsite">On-site</option></select></div></div><label for="location">Location</label><input id="location" value="India" required><label for="skills">Required skills</label><input id="skills" required placeholder="HTML, CSS, JavaScript"><label for="description">What will the student do?</label><textarea id="description" placeholder="Describe the work, mentoring, and outcome."></textarea><button class="continue-btn" type="submit">Publish opportunity →</button></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="api-client.js"></script><script>
const message=document.getElementById('message');
if (!SkillBridgeAPI.token) message.textContent='Sign in as an industry partner to publish.';
document.getElementById('opportunityForm').addEventListener('submit', async event => {event.preventDefault(); try { const data=await SkillBridgeAPI.request('/api/opportunities',{method:'POST',body:JSON.stringify({company:company.value.trim(),title:title.value.trim(),type:type.value,workMode:mode.value,location:location.value.trim(),requiredSkills:skills.value.split(',').map(s=>s.trim()).filter(Boolean),description:description.value.trim()})}); message.textContent=`Published “${data.opportunity.title}”. Students can now see their match and apply.`; event.target.reset(); } catch(error){message.textContent=error.message;}});
</script></body></html>
